name: Garmin Local Test

on:
  workflow_dispatch:

jobs:
  run_local_main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade google-genai gspread oauth2client garminconnect requests

      - name: Create local JSON history if missing
        run: |
          if [ ! -f history.json ]; then
            echo '{"processed_activity_ids": []}' > history.json
          fi

      - name: Run main.py
        run: python main.py

      - name: Finish message
        run: echo "✅ main.py executed, JSON обновлён локально. Пуш не выполняется."
