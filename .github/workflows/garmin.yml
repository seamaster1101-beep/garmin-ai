name: Garmin Daily Sync

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

jobs:
  garmin_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- НОВЫЙ БЛОК: ВОССТАНОВЛЕНИЕ СЕССИИ ---
      - name: Restore Garmin Session
        uses: actions/cache@v3
        with:
          path: ./.garth
          key: ${{ runner.os }}-garmin-session

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect gspread google-auth requests google-generativeai garth

      - name: Run main.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
