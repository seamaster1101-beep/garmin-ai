name: Garmin Daily Sync

on:
  workflow_dispatch: # ТОЛЬКО ручной запуск по кнопке

jobs:
  garmin_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Garmin Session
        run: |
          if [ -n "${{ secrets.GARMIN_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.GARMIN_SESSION_BASE64 }}" | base64 -d | tar -xz || echo "No session found"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем только то, что реально нужно для твоего кода
          pip install garminconnect gspread google-auth requests garth jq pynacl

      - name: Run main.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GARMIN_SESSION_BASE64: ${{ secrets.GARMIN_SESSION_BASE64 }}
        run: python main.py

      - name: Save and Update Garmin Session
        if: always()
        run: |
          if [ -d ".garth" ]; then
            tar -czf session.tar.gz .garth
            SESSION_BASE64=$(base64 -w 0 session.tar.gz)
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)
            PUBLIC_KEY=$(echo $RESPONSE | jq -r .key)
            KEY_ID=$(echo $RESPONSE | jq -r .key_id)
            ENCRYPTED_VALUE=$(python3 -c "import base64; from nacl import public; pub = public.PublicKey(base64.b64decode('$PUBLIC_KEY')); print(base64.b64encode(public.SealedBox(pub).encrypt('$SESSION_BASE64'.encode())).decode())")
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/${{ github.repository }}/actions/secrets/GARMIN_SESSION_BASE64 \
              -d "{\"encrypted_value\":\"$ENCRYPTED_VALUE\",\"key_id\":\"$KEY_ID\"}"
          fi
