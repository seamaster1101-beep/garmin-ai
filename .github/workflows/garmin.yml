name: Garmin Sync

on:
  schedule:
    - cron: '0 6 * * *' # Запуск каждый день в 6 утра
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect gspread google-auth google-generativeai requests

      - name: Run script and update history
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # создаём JSON, если его нет
          if [ ! -f activity_history.json ]; then
            echo "[]" > activity_history.json
          fi

          # запускаем скрипт
          python main.py

          # если JSON обновился, коммитим обратно в репозиторий
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add activity_history.json
          git commit -m "Update activity history" || echo "No changes to commit"
          git push
