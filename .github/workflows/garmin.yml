name: Garmin Sync

on:
  schedule:
    - cron: '0 6 * * *' # Запуск каждый день в 6 утра
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect gspread google-auth requests google-genai

      - name: Run script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # создаём локальный JSON истории, если нет
          if [ ! -f history.json ]; then
            echo '{"processed_activity_ids": []}' > history.json
          fi

          # запускаем main.py
          python main.py

          # убираем пуш в репозиторий, JSON остаётся только локально
          echo "JSON обновлён локально, пуш не выполняется"
