name: Garmin Sync

on:
  schedule:
    - cron: '0 6 * * *'   # запуск каждый день в 06:00 UTC
  workflow_dispatch:      # возможность ручного запуска

jobs:
  garmin_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect gspread google-auth google-genai requests

      - name: Create local history.json if missing
        run: |
          if [ ! -f history.json ]; then
            echo '{"processed_activity_ids": []}' > history.json
          fi

      - name: Run main.py
        run: python main.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Finish
        run: echo "JSON обновлён локально, пуш не выполняется"
